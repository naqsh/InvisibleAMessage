name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop application
        run: dotnet build src/MeetingCopilot.Desktop/MeetingCopilot.Desktop.csproj --configuration Release
      - name: Run tests
        run: dotnet test tests/MeetingCopilot.Tests/MeetingCopilot.Tests.csproj --configuration Release
